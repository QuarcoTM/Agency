name: Temporary post-deploy mobile catalog Lighthouse audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-postdeploy-catalog-audit.yml'

jobs:
  lighthouse:
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lighthouse against real production after successful deployment
        shell: bash
        run: |
          npm install --no-save --no-package-lock lighthouse@12.4.0
          mkdir -p /tmp/catalog-performance
          for tag in category-mobile-1 category-mobile-2 category-mobile-3 home-mobile contact-mobile; do
            case "$tag" in
              category-*) url='https://deninosht.bg/traurni-stoki/kovchezi/' ;;
              home-*) url='https://deninosht.bg/' ;;
              contact-*) url='https://deninosht.bg/kontakti/' ;;
            esac
            echo "::group::PRODUCTION LIGHTHOUSE $tag"
            npx lighthouse "$url" --quiet --output=json --output-path="/tmp/catalog-performance/$tag.json" --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --max-wait-for-load=50000
            node - "/tmp/catalog-performance/$tag.json" "$tag" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const a=r.audits,n=id=>a[id]?.numericValue??null;
          const shifts=a['layout-shift-elements']?.details?.items?.slice(0,3)?.map(i=>({node:i.node?.snippet,score:i.score}))||[];
          const lcpEl=a['largest-contentful-paint-element']?.details?.items?.[0]?.node?.snippet||null;
          const x={tag:process.argv[3],url:r.finalDisplayedUrl,score:Math.round(r.categories.performance.score*100),LCPms:n('largest-contentful-paint'),CLS:n('cumulative-layout-shift'),FCPms:n('first-contentful-paint'),TBTms:n('total-blocking-time'),SpeedIndexMs:n('speed-index'),lcpElement:lcpEl,shiftNodes:shifts,runtimeError:r.runtimeError||null};
          console.log('PERF_RESULT '+JSON.stringify(x));
          NODE
            echo "::endgroup::"
          done
      - name: Attribute CLS shifts to exact DOM elements (mobile network)
        shell: bash
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          node <<'NODE'
          const { chromium } = require('playwright-core');
          (async()=>{
            const browser=await chromium.launch({executablePath:'/usr/bin/google-chrome',headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
            for(const url of ['https://deninosht.bg/','https://deninosht.bg/traurni-stoki/kovchezi/']){
              const context=await browser.newContext({viewport:{width:412,height:823},deviceScaleFactor:1.75,isMobile:true,hasTouch:true});
              const page=await context.newPage();
              await page.addInitScript(()=>{
                window.__layoutShiftEntries=[];
                new PerformanceObserver(list=>{
                  for(const e of list.getEntries()){
                    if(e.hadRecentInput) continue;
                    window.__layoutShiftEntries.push({time:Math.round(e.startTime),value:e.value,sources:(e.sources||[]).map(s=>({element:s.node?.outerHTML?.slice(0,180),before:s.previousRect,after:s.currentRect}))});
                  }
                }).observe({type:'layout-shift',buffered:true});
              });
              const cdp=await context.newCDPSession(page);
              await cdp.send('Network.enable');
              await cdp.send('Network.emulateNetworkConditions',{offline:false,latency:150,downloadThroughput:220000,uploadThroughput:85000});
              await cdp.send('Emulation.setCPUThrottlingRate',{rate:4});
              await page.goto(url,{waitUntil:'domcontentloaded',timeout:45000});
              await page.waitForTimeout(4500);
              const result=await page.evaluate(()=>({shifts:window.__layoutShiftEntries,images:[...document.querySelectorAll('.product-image-wrap img')].slice(0,2).map(x=>({src:x.currentSrc,complete:x.complete,width:x.naturalWidth}))}));
              console.log('CLS_TRACE '+JSON.stringify({url,...result}));
              await context.close();
            }
            await browser.close();
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deninosht-after-catalog-speed
          path: /tmp/catalog-performance/*.json
          if-no-files-found: warn
