name: Agency memorial regression checks

on:
  push:
    branches:
      - safe-publish-memorial-2026-10-28
      - main
      - review-safe-seo-obituaries-2026-11-03
  pull_request:
    paths:
      - 'admin/**'
      - 'kalkulator-pomeni.js'
      - 'kalkulator-pomeni/index.html'
      - 'tests/**'
      - 'catalog.js'
      - 'kategoriya/**'
      - 'nekrolozi/**'
      - 'obituary-examples.*'
      - 'sitemap.xml'
      - 'supabase-analytics*.sql'
      - '.github/workflows/memorial-smoke.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check admin/admin.js
          node --check admin/memorial-zadushnitsi.js
          node --check kalkulator-pomeni.js
          node --check catalog.js
          node --check obituary-examples.js
      - name: Memorial regression tests
        run: node --test tests/*.test.mjs
