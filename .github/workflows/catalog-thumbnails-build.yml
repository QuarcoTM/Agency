name: Generate optimized catalog previews (temporary)
on:
  pull_request:
    paths:
      - 'scripts/build_catalog_thumbnails.py'
      - '.github/workflows/catalog-thumbnails-build.yml'
  workflow_dispatch:
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned Pillow
        run: python -m pip install 'Pillow==11.3.0'
      - name: Generate previews
        run: python scripts/build_catalog_thumbnails.py
      - name: Validate output size and variant count
        shell: bash
        run: |
          python - <<'PY'
          import json, re, pathlib
          s = pathlib.Path('catalog-thumbnails.js').read_text(encoding='utf-8')
          mapping = json.loads(s.split('= ',1)[1].rstrip(';\n'))
          assert len(mapping)>=50
          assert len(list(pathlib.Path('assets/catalog-thumbnails').glob('*.webp')))==len(mapping)*2
          print('Validated',len(mapping),'original image entries and',len(mapping)*2,'optimized files')
          PY
      - name: Commit variants to PR branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/catalog-thumbnails catalog-thumbnails.js
          if ! git diff --cached --quiet; then
            git commit -m 'build: generate responsive WebP previews for existing catalog photos'
            git push origin HEAD:${{ github.head_ref || github.ref_name }}
          else
            echo 'Thumbnails already up to date'
          fi
